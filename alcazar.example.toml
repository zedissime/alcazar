# Paths are relative to this file; `~` is expanded.

[proxy]
tls_cert = "ssl/myapp.test.crt"
tls_key = "ssl/myapp.test.key"

# Shared by every process; a process's own `env` wins.
[env]
NODE_EXTRA_CA_CERTS = "ssl/devCA.pem"

[[process]]
name = "api"
cwd = "../myapp-api"
command = "bundle exec rails s -p 3011"
port = 3011

[[process]]
name = "worker"
cwd = "../myapp-api"
command = "bundle exec sidekiq"

[[process]]
name = "web"
cwd = "../myapp-web"
command = "yarn dev"
env = { PORT = "3010" }
port = 3010

# Registered but not started; run it with `alcazar start admin`.
[[process]]
name = "admin"
cwd = "../myapp-admin"
command = "yarn start"
autostart = false

# No `command`: a Kamal-only accessory (logs and reboot in the dashboard).
[[process]]
name = "registry"
cwd = "~/infra/accessories/registry"

[[route]]
host = "api.myapp.test"
target = "http://localhost:3011"
priority = 20

[[route]]
host_regex = '.+\.myapp\.test'
target = "http://localhost:3010"
priority = 10
